<section class="panel wasm-media" data-ref="root">
  <header class="panel__header">
    <h3 data-ref="label"></h3>
    <span class="panel__meta" data-ref="meta"></span>
  </header>
  <code class="wasm-media__filter" data-ref="filter" tabindex="0" hidden></code>
  <div class="wasm-media__progress" data-ref="progress" role="progressbar" hidden>
    <span data-ref="progress-bar"></span>
  </div>
  <div data-ref="actions"></div>
  <p class="wasm-media__error" data-ref="error" hidden></p>
</section>
