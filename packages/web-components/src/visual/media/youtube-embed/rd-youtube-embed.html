<div class="rd-media-youtube-embed" data-ref="root">
  <iframe
    data-ref="iframe"
    class="rd-media-youtube-embed__iframe"
    title="YouTube video"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
  <p class="rd-media-youtube-embed__empty" data-ref="empty" hidden>
    Provide a YouTube video id or URL.
  </p>
</div>
