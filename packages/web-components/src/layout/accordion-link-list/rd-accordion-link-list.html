<section
  class="rd-accordion rd-accordion-link-list"
  data-ref="root"
  data-testid="rd-accordion-link-list"
>
  <button
    type="button"
    class="rd-accordion__header"
    data-ref="header"
    aria-expanded="false"
    aria-controls="rd-accordion-link-list-panel"
  >
    <span class="rd-accordion__title" data-ref="title"></span>
    <span class="rd-accordion__chevron" aria-hidden="true">›</span>
  </button>
  <div class="rd-accordion__panel" id="rd-accordion-link-list-panel" role="region" data-ref="panel">
    <ul class="rd-link-list" data-ref="list"></ul>
  </div>
</section>
