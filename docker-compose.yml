# DashBuilder local containers
#
# Dev (hot reload, mount source):
#   docker compose --profile dev up --build
#   → http://localhost:4200 (UI), http://localhost:3000/api (API direct)
#
# App (production-style build, no bind mount):
#   docker compose --profile app up --build
#   → http://localhost:8080 (UI + /api proxy)

services:
  dashbuilder-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
      - '3000:3000'
    volumes:
      - .:/workspace
      - dashbuilder_node_modules:/workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      PORT: '3000'
      HOST: '0.0.0.0'
      BUILDER_AUTH_ENABLED: 'false'
      # BUILDER_API_KEY: 'change-me'

  dashbuilder:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      PORT: '3000'
      HOST: '127.0.0.1'
      NODE_ENV: production
      BUILDER_AUTH_ENABLED: 'false'
      # BUILDER_API_KEY: 'change-me'

volumes:
  dashbuilder_node_modules:
