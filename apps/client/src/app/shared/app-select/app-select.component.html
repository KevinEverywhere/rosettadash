<div
  class="app-select"
  [class.app-select--open]="open()"
  [class.app-select--disabled]="isDisabled()"
  [attr.data-testid]="testId()"
>
  <button
    #trigger
    type="button"
    class="app-select__trigger"
    [attr.data-testid]="testId() ? testId() + '-trigger' : null"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'listbox'"
    [disabled]="isDisabled()"
    (click)="toggleMenu()"
  >
    <span class="app-select__value">{{ selectedLabel() }}</span>
    <span class="app-select__chevron" aria-hidden="true"></span>
  </button>

  @if (open()) {
    <ul
      #menu
      class="app-select__menu"
      [class.app-select__menu--positioned]="menuPositioned()"
      role="listbox"
      [attr.data-testid]="testId() ? testId() + '-menu' : null"
      [ngStyle]="menuStyle()"
    >
      @if (emptyOptionLabel()) {
        <li role="presentation">
          <button
            type="button"
            role="option"
            class="app-select__option"
            [class.app-select__option--selected]="isEmptySelected()"
            [attr.data-testid]="emptyOptionTestId()"
            [attr.aria-selected]="isEmptySelected()"
            (click)="pickEmpty()"
          >
            {{ emptyOptionLabel() }}
          </button>
        </li>
      }
      @for (option of options(); track option.value) {
        <li role="presentation">
          <button
            type="button"
            role="option"
            class="app-select__option"
            [class.app-select__option--selected]="isSelected(option.value)"
            [attr.data-testid]="optionTestId(option.value)"
            [attr.aria-selected]="isSelected(option.value)"
            (click)="pick(option.value)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
