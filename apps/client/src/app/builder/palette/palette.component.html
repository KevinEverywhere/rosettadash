<aside class="palette" data-testid="palette">
  <header class="palette__header">
    <h2>Components</h2>
    <p>Click to inspect, + to add</p>
  </header>

  @for (group of groups(); track group.category) {
    <section class="palette__group">
      <h3>{{ group.label }}</h3>
      <ul class="palette__list">
        @for (item of group.items; track item.type) {
          <li>
            <button
              type="button"
              class="palette__item"
              [class.palette__item--selected]="selectedType() === item.type"
              (click)="select(item)"
            >
              <span class="palette__item-label">{{ item.label }}</span>
              <span class="palette__actions">
                @if (!item.isVisual) {
                  <span class="palette__badge">infra</span>
                }
                <span
                  class="palette__add"
                  role="button"
                  tabindex="0"
                  title="Add to canvas"
                  [attr.data-testid]="'palette-add-' + item.type"
                  (click)="add(item, $event)"
                  (keydown.enter)="add(item, $event)"
                  (keydown.space)="add(item, $event)"
                >+</span>
              </span>
            </button>
          </li>
        }
      </ul>
    </section>
  }
</aside>
