<div class="builder">
  <header class="builder__toolbar">
    <div class="builder__brand">
      <span class="builder__logo">{{ appName }}</span>
      <span class="builder__subtitle">{{ state.project()?.name ?? 'Builder' }}</span>
    </div>

    <div class="builder__actions">
      @if (state.errorMessage()) {
        <span class="builder__error">{{ state.errorMessage() }}</span>
      }
      <span class="builder__status" [class.builder__status--dirty]="state.dirty()">
        {{ statusLabel() }}
      </span>
      <button
        type="button"
        class="builder__save"
        [disabled]="state.loading() || state.saveStatus() === 'saving' || !state.dirty()"
        (click)="save()"
      >
        Save
      </button>
    </div>
  </header>

  @if (state.loading()) {
    <div class="builder__loading">Loading project…</div>
  } @else {
    <div class="builder__workspace">
      <app-palette class="builder__palette" />
      <app-canvas class="builder__canvas" />
      <app-inspector class="builder__inspector" />
    </div>
  }
</div>
