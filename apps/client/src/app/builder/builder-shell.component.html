<div class="builder" data-testid="builder-shell">
  <header class="builder__toolbar">
    <div class="builder__brand">
      <span class="builder__logo">{{ appName }}</span>
      <span class="builder__subtitle">{{ state.project()?.name ?? 'Builder' }}</span>
    </div>

    <div class="builder__actions">
      <div class="builder__modes" role="tablist" aria-label="Workspace mode">
        <button
          type="button"
          class="builder__mode"
          data-testid="mode-design"
          role="tab"
          [attr.aria-selected]="state.workspaceMode() === 'design'"
          [class.builder__mode--active]="state.workspaceMode() === 'design'"
          (click)="setWorkspaceMode('design')"
        >
          Design
        </button>
        <button
          type="button"
          class="builder__mode"
          data-testid="mode-preview"
          role="tab"
          [attr.aria-selected]="state.workspaceMode() === 'preview'"
          [class.builder__mode--active]="state.workspaceMode() === 'preview'"
          (click)="setWorkspaceMode('preview')"
        >
          Preview
        </button>
      </div>
      @if (state.errorMessage()) {
        <span class="builder__error">{{ state.errorMessage() }}</span>
      }
      <span
        class="builder__status"
        data-testid="save-status"
        [class.builder__status--dirty]="state.dirty()"
      >
        {{ statusLabel() }}
      </span>
      <button
        type="button"
        class="builder__template"
        data-testid="apply-onboarding-template"
        [disabled]="state.loading()"
        (click)="applyOnboardingTemplate()"
      >
        Onboarding template
      </button>
      <button
        type="button"
        class="builder__export"
        data-testid="export-button"
        [disabled]="state.loading()"
        (click)="openExportWizard()"
      >
        Export
      </button>
      <button
        type="button"
        class="builder__save"
        data-testid="save-button"
        [disabled]="state.loading() || state.saveStatus() === 'saving' || !state.dirty()"
        (click)="save()"
      >
        Save
      </button>
    </div>
  </header>

  @if (state.loading()) {
    <div class="builder__loading" data-testid="builder-loading">Loading project…</div>
  } @else {
    <div class="builder__workspace">
      <app-palette class="builder__palette" />
      @if (state.workspaceMode() === 'design') {
        <app-canvas class="builder__canvas" data-testid="design-workspace" />
      } @else {
        <app-preview-panel class="builder__canvas" data-testid="preview-workspace" />
      }
      <app-inspector class="builder__inspector" />
    </div>
  }
</div>

<app-export-wizard [open]="exportWizardOpen()" (closed)="closeExportWizard()" />
